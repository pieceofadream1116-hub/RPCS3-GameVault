name: Build Xbox UWP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm llvm-18 clang-18 lld-18 osslsigncode p7zip-full \
            pkg-config bison flex glslang-tools libssl-dev libicu-dev zlib1g-dev
          pip install ziglang cmake ninja meson mako pyyaml packaging
          sudo ln -sf /usr/bin/llvm-windres-18 /usr/local/bin/llvm-windres
          sudo ln -sf /usr/bin/llvm-dlltool-18 /usr/local/bin/llvm-dlltool
          sudo ln -sf /usr/bin/llvm-nm-18 /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objdump-18 /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-readobj-18 /usr/local/bin/llvm-readobj
          sudo ln -sf /usr/bin/llvm-strip-18 /usr/local/bin/llvm-strip
          sudo ln -sf /usr/bin/llvm-objcopy-18 /usr/local/bin/llvm-objcopy
          # ar and ranlib must match the compiler (zig's LLVM), not LLVM 18
          printf '#!/bin/sh\nexec python3 -m ziglang ar "$@"\n' | sudo tee /usr/local/bin/llvm-ar > /dev/null
          printf '#!/bin/sh\nexec python3 -m ziglang ranlib "$@"\n' | sudo tee /usr/local/bin/llvm-ranlib > /dev/null
          sudo chmod +x /usr/local/bin/llvm-ar /usr/local/bin/llvm-ranlib
          /usr/local/bin/llvm-ar --version
          llvm-objdump --version | head -n 2

      - name: Point developer folder at this project
        run: |
          # some toolchain files point at the original developer's own folder
          sudo mkdir -p /home/claude/RPCS3
          sudo ln -sfn "$PWD" /home/claude/RPCS3/rpcs3
          chmod +x uwp/toolchain/zig-* || true
          ls -l /home/claude/RPCS3/rpcs3/uwp/toolchain

      - name: Build makemsix
        run: |
          git clone --depth 1 https://github.com/microsoft/msix-packaging.git
          cd msix-packaging
          ./makelinux.sh --pack -b MinSizeRel
          echo "MAKEMSIX=$(find $PWD -name makemsix -type f | head -n 1)" >> $GITHUB_ENV

      - name: Vulkan headers
        run: git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git

      - name: Restore LLVM cache
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: llvm-install
          key: llvm-uwp-${{ hashFiles('uwp/toolchain/build-llvm.sh') }}

      - name: Build FFmpeg
        run: |
          git clone --depth 1 --branch n8.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          uwp/toolchain/build-ffmpeg.sh ffmpeg-src ffmpeg-build ffmpeg-install

      - name: Build LLVM (about 1 hour)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          uwp/toolchain/build-llvm.sh llvm-build llvm-install
          rm -rf llvm-build

      - name: Save LLVM cache
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: llvm-install
          key: llvm-uwp-${{ hashFiles('uwp/toolchain/build-llvm.sh') }}

      - name: Build RPCS3
        run: |
          AR=/usr/local/bin/llvm-ar
          RANLIB=/usr/local/bin/llvm-ranlib
          cmake -S . -B build-uwp -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=uwp/toolchain/toolchain-uwp.cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_AR=$AR -DCMAKE_RANLIB=$RANLIB \
            -DCMAKE_C_COMPILER_AR=$AR -DCMAKE_CXX_COMPILER_AR=$AR \
            -DCMAKE_C_COMPILER_RANLIB=$RANLIB -DCMAKE_CXX_COMPILER_RANLIB=$RANLIB \
            -DRPCS3_UWP=ON -DRPCS3_UWP_FFMPEG_LIB_DIR=$PWD/ffmpeg-install/lib \
            -DUSE_VULKAN=ON -DRPCS3_UWP_VULKAN_INCLUDE_DIR=$PWD/Vulkan-Headers/include \
            -DWITH_LLVM=ON -DBUILD_LLVM=OFF -DSTATIC_LINK_LLVM=ON -DLLVM_DIR=$PWD/llvm-install/lib/cmake/llvm \
            -DUSE_NATIVE_INSTRUCTIONS=OFF -DUSE_PRECOMPILED_HEADERS=OFF \
            -DUSE_SDL=OFF -DUSE_FAUDIO=OFF -DUSE_SYSTEM_ZLIB=OFF -DUSE_SYSTEM_CURL=OFF -DUSE_SYSTEM_SDL=OFF \
            -DUSE_DISCORD_RPC=OFF -DUSE_GAMEMODE=OFF -DUSE_LIBEVDEV=OFF
          ninja -C build-uwp rpcs3_uwp rpcs3_uwp_importcheck

      - name: Build Mesa Dozen
        run: |
          # Mesa's setup expects the original developer's import-library folder
          IMPLIBS=/home/claude/uwp-port/build/uwp-implibs
          sudo mkdir -p $IMPLIBS
          sudo chown -R "$(id -u):$(id -g)" /home/claude/uwp-port
          echo "===== where the project mentions these files ====="
          grep -rn "uwp-implibs\|sysstubs" uwp | head -n 40 || true
          find . -iname "*sysstubs*" -not -path "./mesa-*" || true
          # d3d12 and dxcore import libraries
          printf 'LIBRARY d3d12.dll\nEXPORTS\nD3D12CreateDevice\nD3D12CreateRootSignatureDeserializer\nD3D12CreateVersionedRootSignatureDeserializer\nD3D12EnableExperimentalFeatures\nD3D12GetDebugInterface\nD3D12GetInterface\nD3D12SerializeRootSignature\nD3D12SerializeVersionedRootSignature\n' > $IMPLIBS/d3d12.def
          printf 'LIBRARY dxcore.dll\nEXPORTS\nDXCoreCreateAdapterFactory\n' > $IMPLIBS/dxcore.def
          for l in d3d12 dxcore; do
            python3 -m ziglang dlltool -m i386:x86-64
